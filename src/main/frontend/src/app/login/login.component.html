<div class="login-wrapper">
  <div class="login-card">

    <h2>Vítejte zpět</h2>
    <p class="login-subtitle">Pro přístup do systému se prosím přihlaste.</p>

    <form (submit)="$event.preventDefault()">
      <div class="form-group">
        <label for="email">E-mailová adresa</label>
        <input type="email" id="email" placeholder="jmeno@firma.cz" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Heslo</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox"> Zapamatovat si mě
        </label>
        <a href="#" class="forgot-pass" (click)="$event.preventDefault()">Zapomenuté heslo?</a>
      </div>

      <button type="submit" class="btn-login">Přihlásit se</button>
    </form>

    <div class="login-footer">
      Nemáte ještě účet? <a href="#" (click)="$event.preventDefault()">Zaregistrujte se</a>
    </div>

  </div>
</div>
