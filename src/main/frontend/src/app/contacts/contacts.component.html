<h2>Kontakty</h2>

<p *ngIf="loading">Načítání...</p>
<p *ngIf="error" style="color: red">{{ error }}</p>

<table *ngIf="!loading && !error">
  <tbody>
  <tr *ngFor="let contact of contacts">
    <td>{{ contact.name }}</td>
    <td>{{ contact.email }}</td>
    <td>{{ contact.phone }}</td>
  </tr>
  </tbody>
</table>
