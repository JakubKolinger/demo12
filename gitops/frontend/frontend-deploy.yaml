apiVersion: apps/v1
kind: Deployment
metadata:
  name: jakub-frontend
  namespace: praxe2026
  labels:
    app: jakub-frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: jakub-frontend

  template:
    metadata:
      labels:
        app: jakub-frontend

    spec:
      containers:
        - name: jakub-frontend
          image: ghcr.io/jakubkolinger/praxe-demo12-frontend:latest
          ports:
            - containerPort: 4200
---
apiVersion: v1
kind: Service
metadata:
  name: jakub-frontend
  namespace: praxe2026

spec:
  selector:
    app: jakub-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 4200