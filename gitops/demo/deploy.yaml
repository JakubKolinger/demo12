apiVersion: apps/v1
kind: Deployment
metadata:
  name: jakub
  namespace: praxe2026
  labels:
    app: jakub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jakub
  template:
    metadata:
      labels:
        app: jakub
    spec:
      containers:
        - name: jakub
          image: ghcr.io/jakubkolinger/praxe-demo12:latest
          ports:
            - containerPort: 8080
