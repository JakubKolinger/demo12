apiVersion: apps/v1
kind: Deployment
metadata:
  name: jakub
  namespace: praxe2026
  labels:
    app: jakub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jakub
  template:
    metadata:
      labels:
        app: jakub
    spec:
      containers:
        - name: jakub
          image: ghcr.io/jakubkolinger/praxe-demo12:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090


---

apiVersion: v1
kind: Service
metadata:
  name: jakub-svc
  namespace: praxe2026
spec:
  selector:
    app: jakub
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8090